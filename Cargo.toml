[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]

[workspace.dependencies]
carrion-api = { version = "0.1.0", path = "crates/carrion-api" }
serde = { version = "1.0.229", features = ["derive"] }
abi_stable = "0.11.3"
toml = "1.1.8"

winit = "0.30.13"
egui = "0.37.0"
egui-winit = "0.37.0"
egui-wgpu = { version = "0.37.0", features = ["winit"] }

[profile.dev]
split-debuginfo = "unpacked"
