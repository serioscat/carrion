[package]
name = "carrion"
version = "0.1.0"
edition = "2024"
authors = ["serioscat"]
description = "Super customizable overlay"
license = "MIT"
repository = "https://github.com/serioscat/carrion"
homepage = "https://github.com/serioscat/carrion"

[build-dependencies]
slint-build = "1.18.1"

[dependencies]
carrion-api = { workspace = true, features = ["egui"] }
abi_stable.workspace = true
serde.workspace = true
toml.workspace = true

winit.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui-wgpu.workspace = true

dirs = "7.0.0"
anyhow = "1.0.104"
once_cell = "1.21.4"

tracing-subscriber = { version = "0.3.23", features = ["env-filter", "local-time"] }
tracing = "0.1.44"
time = { version = "0.3.55", features = ["macros"] }

pollster = "1.0.1"

global-hotkey = "0.9.0"
raw-window-handle = "0.6.2"
x11-dl = "2.21.0"
clap = { version = "4.6.7", features = ["derive"] }
parking_lot = "0.13.0"

